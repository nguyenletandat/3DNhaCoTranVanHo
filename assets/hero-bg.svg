<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2415"/>
      <stop offset="45%" stop-color="#8a5a30"/>
      <stop offset="75%" stop-color="#cf9a52"/>
      <stop offset="100%" stop-color="#e8c98a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6dfa8"/>
      <stop offset="100%" stop-color="#f6dfa8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="330" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="330" r="90" fill="#f3d9a4" opacity="0.9"/>
  <!-- mây -->
  <g fill="#3a2415" opacity="0.18">
    <ellipse cx="260" cy="200" rx="180" ry="26"/>
    <ellipse cx="520" cy="260" rx="140" ry="20"/>
    <ellipse cx="900" cy="160" rx="220" ry="24"/>
  </g>
  <!-- đất -->
  <rect x="0" y="760" width="1600" height="240" fill="#2b1d12"/>
  <!-- nhà cổ cách điệu: 3 gian, mái cong Nam Bộ, cột hiên -->
  <g fill="#2b1d12">
    <!-- nền/thềm -->
    <rect x="260" y="700" width="1080" height="70" />
    <!-- mái chính (2 lớp, đầu đao cong) -->
    <path d="M 300 620 Q 800 480 1300 620 L 1300 650 Q 800 520 300 650 Z" />
    <path d="M 340 660 Q 800 540 1260 660 L 1260 690 Q 800 580 340 690 Z" />
    <!-- đầu đao cong 2 bên -->
    <path d="M 300 650 Q 250 640 235 600" stroke="#2b1d12" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 1300 650 Q 1350 640 1365 600" stroke="#2b1d12" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- thân nhà -->
    <rect x="360" y="690" width="880" height="80" fill="#241809"/>
    <!-- cột hiên -->
    <g fill="#1c1206">
      <rect x="400" y="690" width="18" height="90"/>
      <rect x="560" y="690" width="18" height="90"/>
      <rect x="720" y="690" width="18" height="90"/>
      <rect x="862" y="690" width="18" height="90"/>
      <rect x="1022" y="690" width="18" height="90"/>
      <rect x="1182" y="690" width="18" height="90"/>
    </g>
    <!-- cửa chính gian giữa -->
    <rect x="760" y="700" width="80" height="80" fill="#120b03"/>
  </g>
  <text x="50%" y="960" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="20" letter-spacing="2" fill="#f2e8d5" opacity="0.6">ẢNH NỀN TẠM THỜI — THAY BẰNG ẢNH THẬT CỦA CÔNG TRÌNH</text>
</svg>