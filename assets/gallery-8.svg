  </defs>
  <rect width="900" height="700" fill="url(#g)"/>
  <rect width="900" height="700" fill="url(#weave)"/>
  <rect x="18" y="18" width="864" height="664" fill="none" stroke="#fbf6ec" stroke-opacity="0.55" stroke-width="2"/>
  <text x="50%" y="46%" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="63" fill="#fbf6ec" opacity="0.95">Phục dựng bản vẽ</text>
  <text x="50%" y="58%" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="25" letter-spacing="1.5" fill="#fbf6ec" opacity="0.75">ẢNH TẠM THỜI — THAY BẰNG ẢNH THẬT</text>
